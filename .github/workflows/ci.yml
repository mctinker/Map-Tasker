name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  test:
    # The Ubuntu jobs keep their original names ("test (py3.11)" ...) so any branch
    # protection rule that requires them still matches; the Windows and macOS jobs add
    # "windows, " and "macos, ".
    name: test (${{ matrix.os == 'windows-latest' && 'windows, ' || matrix.os == 'macos-latest' && 'macos, ' || '' }}py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # pyproject requires-python = ">=3.11, <4.0"
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # One Windows job and one macOS job, on the newest Python the CI matrix shares with a
        # release: enough to catch path, drive-letter and per-user-folder differences
        # (outdir's Documents folder, apikeys' %APPDATA%) without tripling the matrix.  macOS is
        # where the program is developed and where most users run it: font discovery
        # (mapfonts), the Documents and Application Support folders, the Keychain behind the
        # password store, and the case-insensitive filesystem all differ from Linux.
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    # Git Bash on Windows, so the steps below (the coverage summary's { ... } >> redirect
    # in particular) run the same on every system.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project and test dependencies
        run: uv sync --locked --group test

      # -n auto: one worker per core, which is what the runner has to give.  No single test is slow, so the
      # time is spread evenly; tests/conftest.py puts PrimeItems back after each one, so none depends on
      # the one before.  pytest-cov combines the workers' coverage.
      - name: Run tests with coverage
        run: >
          uv run --no-sync pytest
          -n auto
          --cov=maptasker
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --junitxml=junit-${{ matrix.python-version }}.xml

      # fail_under is one number for the whole program, which lets a well-tested layer cover for
      # a neglected one.  This holds each layer (gui, core, mapgen ...) to its own floor in
      # scripts/coverage_baseline.json, read from the .coverage data the run above just made.
      - name: Coverage by layer
        run: uv run --no-sync python scripts/coverage_ratchet.py

      - name: Summarise coverage
        if: always()
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }}, ${{ runner.os }})"
            echo
            # '|| true' because coverage exits 2 when below fail_under; the test
            # step above is the gate, this step only renders the report.
            uv run --no-sync coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          # Artifact names must be unique within a run, and all three systems run 3.13.
          name: reports-${{ matrix.os == 'windows-latest' && 'windows-' || matrix.os == 'macos-latest' && 'macos-' || '' }}py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # ai-dev: the type check resolves the AI libraries the AI modules import.  A plain
      # `uv sync` does not install them, and nothing else in this job needs them.
      - name: Install dev dependencies
        run: uv sync --locked --group dev --group ai-dev

      # Every rule applies in every file: [tool.ruff.lint.per-file-ignores] in pyproject.toml
      # holds only deliberate exemptions (tests, scripts, __init__.py), so this gate fails on
      # any new violation.
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github

      # The per-file ignores above only shrink; this does the same for inline noqa
      # comments. It fails if any rule's count rises above scripts/noqa_baseline.json,
      # and if a count falls without the baseline being lowered to match (--update).
      - name: noqa ratchet
        run: uv run --no-sync python scripts/noqa_ratchet.py

      # ruff's max-statements/-branches/-args and mccabe limits in pyproject.toml are ceilings
      # no function may pass. The targets new code is held to are lower
      # ([tool.complexity-ratchet]); the functions still over them are listed, measure by
      # measure, in scripts/complexity_baseline.json. This fails on a new one, on one that got
      # worse, and on one that got better until the baseline is lowered to match (--update).
      - name: complexity ratchet
        run: uv run --no-sync python scripts/complexity_ratchet.py

      # ruff's ANN rules require annotations; pyright ([tool.pyright] in pyproject.toml,
      # basic mode) checks that they are right. The errors that predate it are counted per
      # file and rule in scripts/pyright_baseline.json: this fails on any new one, and on a
      # fixed one until the baseline is lowered to match (--update), as the noqa ratchet does.
      - name: typecheck ratchet
        run: uv run --no-sync python scripts/typecheck_ratchet.py

      # [tool.importlinter] in pyproject.toml: entry points above the GUI, the GUI above the
      # core, and NiceGUI imported only by the GUI. Every module has to be placed in a layer,
      # so a new one fails here until it is.
      - name: import layers
        run: uv run --no-sync lint-imports

      # Enforced as of the format sweep. [tool.ruff.format] uses ruff's stable
      # style (preview = false), which only changes on a major release, so this
      # gate stays reproducible without pinning the ruff version.
      - name: ruff format --check
        run: uv run --no-sync ruff format --check

  # How long the Map and the Diagram take to build (scripts/perf_check.py), against scripts/perf_baseline.json.
  # Timed in units of a fixed piece of Python work, so a slower machine does not fail it -- but the
  # baseline was recorded on a developer's Mac, and a hosted runner is a different processor.  Until a
  # baseline recorded here proves steady (`python scripts/perf_check.py --update` on this job's output),
  # it reports without failing the workflow; run-ci.sh makes it a gate on the machine that recorded it.
  performance:
    name: build speed
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project and test dependencies
        run: uv sync --locked --group test

      - name: Time the Map and the Diagram
        run: |
          uv run --no-sync python scripts/perf_check.py | tee perf.txt
          {
            echo "### Build speed (Python 3.13, ${{ runner.os }})"
            echo '```'
            cat perf.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
